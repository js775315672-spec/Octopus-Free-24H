name: P0 policy CI
on: [pull_request]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest -v test_policy test_inference

  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build pinned llama.cpp and verify official GGUF
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/llama"
          git -C "$RUNNER_TEMP/llama" fetch --depth=1 https://github.com/ggml-org/llama.cpp.git a7a98e0fffed794396b3fbad4dcdbbc184963645
          git -C "$RUNNER_TEMP/llama" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama" rev-parse HEAD)" = a7a98e0fffed794396b3fbad4dcdbbc184963645
          cmake -S "$RUNNER_TEMP/llama" -B "$RUNNER_TEMP/llama/build" -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/llama/build" --target llama-cli -j 2
          curl --fail --location --retry 2 --max-time 240 -o "$RUNNER_TEMP/model.gguf" https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
          echo "cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046  $RUNNER_TEMP/model.gguf" | sha256sum -c -
          sha256sum "$RUNNER_TEMP/llama/build/bin/llama-cli" > "$RUNNER_TEMP/binary.sha"
      - name: Real CPU inference evidence (no generated code execution)
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/binary.sha"
          python3 inference_runner.py "$RUNNER_TEMP/llama/build/bin/llama-cli" "$RUNNER_TEMP/model.gguf" "$(cut -d ' ' -f1 "$RUNNER_TEMP/binary.sha")" cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046 > "$RUNNER_TEMP/inference.json"
          cat "$RUNNER_TEMP/inference.json"
          sha256sum "$RUNNER_TEMP/inference.json"
